    <script>
      if (navigator.userAgent.indexOf('Chrome/') !== -1) {
        document.documentElement.classList.add('liquid');
      }

  <body>
    <svg width="0" height="0" style="position:absolute;pointer-events:none" aria-hidden="true">
      <filter id="liquid-glass" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
        <feTurbulence id="liquid-turbulence" type="fractalNoise" baseFrequency="0.007 0.0105" numOctaves="2" seed="11" result="noise" />
        <feGaussianBlur in="noise" stdDeviation="2" result="blurred" />
        <feDisplacementMap id="liquid-displacement" in="SourceGraphic" in2="blurred" scale="40" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
